services:
  app:
    build: .
    image: woodandclay:latest
    container_name: woodandclay
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /opt/woodclay-data:/data:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - xray

  # Local HTTP proxy over the VLESS tunnel, used only for the outbound
  # Telegram API call (see app/api/corporate-quote/route.ts) — Telegram's
  # servers are unreachable directly from this network path. Not exposed to
  # the host; only "app" can reach it, via the internal compose network.
  xray:
    image: ghcr.io/xtls/xray-core:latest
    container_name: woodandclay-xray
    restart: unless-stopped
    # The image defaults to loading every .json file in its own baked-in
    # /usr/local/etc/xray/ confdir — passing -c here overrides that and
    # forces it to use only our mounted config instead.
    command: ["run", "-c", "/etc/xray/config.json"]
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro

  # Catalogue database (Phase 1). POSTGRES_DB/USER/PASSWORD come from the
  # server's .env (docker compose auto-loads it for ${...} substitution in
  # this file, same .env the app service injects wholesale via env_file).
  # Port is published on 127.0.0.1 only — same localhost-only pattern as
  # "app" above — but other services on this compose network (app, and a
  # later Directus) can also reach it internally as host "postgres:5432"
  # without any port publishing at all.
  postgres:
    image: postgres:16-alpine
    container_name: woodandclay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /opt/woodclay-pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Catalogue curation admin (Phase 2). Port published on 127.0.0.1 only —
  # same pattern as "app" and "postgres" above, needed because nginx runs on
  # the host, not in this compose network, so it reaches this container via
  # 127.0.0.1:8055, not the internal hostname. Pinned to the same Directus
  # version as the local dev instance (directus-admin/package.json) so the
  # custom extensions mounted below are known to be compatible.
  # See docs/DIRECTUS.md.
  directus:
    image: directus/directus:12.1.1
    container_name: woodandclay-directus
    restart: unless-stopped
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Served at its own port (nginx has a second server block on :8080
      # proxying 1:1 to this port), not a URL sub-path — Directus's admin
      # SPA isn't built to be sub-path-served: its static assets are rooted
      # at /assets/... while client-side routes need the prefix preserved,
      # and no reverse-proxy rewrite reconciles both. See docs/DIRECTUS.md.
      PUBLIC_URL: http://161.104.44.9:8080/
      EXTENSIONS_PATH: /directus/extensions
      # Lets <img> thumbnails pointed at the Selectel bucket (source_images
      # URLs) render in the Data Studio without being blocked by Directus's
      # default CSP — matches directus-admin/.env locally.
      CONTENT_SECURITY_POLICY_DIRECTIVES__IMG_SRC: "array:'self',data:,blob:,https://1bdb1afd-641e-4c4c-be89-1010e798b2e5.selstorage.ru"
    volumes:
      - /opt/woodclay-directus-extensions:/directus/extensions:ro
      - /opt/woodclay-directus-uploads:/directus/uploads
    ports:
      - "127.0.0.1:8055:8055"
    depends_on:
      postgres:
        condition: service_healthy
